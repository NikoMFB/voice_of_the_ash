<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поздравительная открытка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎉 С ПРАЗДНИКОМ! 🎉</h1>
            
            <div class="character-container">
                <img id="character" src="mouth-closed.png" alt="Персонаж">
            </div>
            
            <button id="speakBtn" class="speak-button">
                🔈 Нажми, чтобы услышать поздравление
            </button>
            
            <div id="message" class="message hidden">
                <!-- Текст будет появляться здесь -->
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
