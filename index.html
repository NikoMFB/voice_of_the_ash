<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPEN ME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            min-height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
            touch-action: manipulation;
            padding: 0;
            margin: 0;
        }

        /* Еле заметный шум */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.02) 0px,
                rgba(255, 255, 255, 0.02) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
        }

        .game-container {
            width: 100%;
            max-width: 390px; /* iPhone 14 width */
            height: 100vh;
            max-height: 844px; /* iPhone 14 height */
            position: relative;
            overflow: hidden;
            background: #000;
            margin: 0 auto;
        }

        /* Основное изображение на весь экран */
        .fullscreen-image {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #characterImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: contrast(1.05) brightness(0.95);
            image-rendering: crisp-edges;
        }

        /* Виньетка для глубины */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, 
                        transparent 40%, 
                        rgba(0, 0, 0, 0.4) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* Контейнер для динамических субтитров */
        .subtitles-container {
            position: absolute;
            bottom: 180px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            z-index: 20;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .subtitles {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.95);
            font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
            font-size: 18px; /* Оптимально для iPhone 14 */
            line-height: 1.5;
            padding: 16px 22px;
            max-width: 100%;
            width: auto;
            min-width: 280px;
            text-align: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            letter-spacing: 0.3px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
            word-break: keep-all;
            white-space: pre-wrap;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .subtitles.visible {
            opacity: 1;
        }

        /* Анимация появления */
        .subtitles.fade-in {
            animation: subtitleFade 0.3s ease;
        }

        @keyframes subtitleFade {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Нижняя область для кнопки */
        .bottom-area {
            position: absolute;
            bottom: 70px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        /* Кнопка в стиле Outlast */
        .action-button {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 2px;
            padding: 12px 40px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            text-transform: lowercase;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            min-width: 180px;
            text-align: center;
            border-radius: 0;
        }

        .action-button:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.98);
        }

        .action-button.playing {
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        /* Индикатор времени субтитров (очень тонкий) */
        .subtitle-timer {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.25);
            font-size: 11px;
            font-family: monospace;
            letter-spacing: 1px;
            z-index: 22;
        }

        @media (max-width: 390px) {
            .subtitles {
                font-size: 16px;
                padding: 14px 18px;
                min-width: 240px;
            }
            
            .action-button {
                font-size: 20px;
                padding: 10px 30px;
                min-width: 160px;
            }
            
            .bottom-area {
                bottom: 60px;
            }
            
            .subtitles-container {
                bottom: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Основное изображение -->
        <div class="fullscreen-image">
            <img src="mouth-closed.png" alt="" id="characterImage">
        </div>
        
        <!-- Виньетка -->
        <div class="vignette"></div>
        
        <!-- Динамические субтитры -->
        <div class="subtitles-container">
            <div class="subtitles" id="subtitles"></div>
        </div>
        
        <!-- Таймер (почти невидимый) -->
        <div class="subtitle-timer" id="subtitleTimer"></div>
        
        <!-- Кнопка -->
        <div class="bottom-area">
            <button class="action-button" id="actionButton">
                hello
            </button>
        </div>
    </div>

    <script>
        class DynamicSubtitles {
            constructor() {
                // Элементы
                this.image = document.getElementById('characterImage');
                this.button = document.getElementById('actionButton');
                this.subtitles = document.getElementById('subtitles');
                this.timer = document.getElementById('subtitleTimer');
                
                // Аудио файлы
                this.audioFiles = {
                    hello: 'voice1.mp3',
                    thanks: 'voice2.mp3'
                };
                
                // Разбивка текста на динамические субтитры (оптимизировано для iPhone 14)
                this.subtitleParts = [
                    { text: "Соединение прервано.", start: 0, end: 2.5 },
                    { text: "Мне жаль, что я прерываю вас, Элизабет,", start: 2.5, end: 5.5 },
                    { text: "если вы еще помните это имя,", start: 5.5, end: 8 },
                    { text: "но боюсь, вас дезинформировали.", start: 8, end: 10.5 },
                    { text: "Вы здесь не для того,", start: 10.5, end: 12.5 },
                    { text: "чтобы получить подарок,", start: 12.5, end: 14.5 },
                    { text: "и вас не позвал сюда человек,", start: 14.5, end: 17 },
                    { text: "которого вы предполагаете,", start: 17, end: 19 },
                    { text: "хотя вас действительно позвали.", start: 19, end: 21.5 },
                    { text: "Вы все были вызваны сюда,", start: 21.5, end: 24 },
                    { text: "в лабиринт звуков и запахов,", start: 24, end: 26.5 },
                    { text: "дезинформации и несчастий.", start: 26.5, end: 29 },
                    { text: "Лабиринт без выхода,", start: 29, end: 31 },
                    { text: "лабиринт без приза.", start: 31, end: 33 },
                    { text: "Вы даже не понимаете,", start: 33, end: 35 },
                    { text: "что попали в ловушку.", start: 35, end: 37 },
                    { text: "Ваша жажда крови", start: 37, end: 39 },
                    { text: "загнала вас в бесконечные круги,", start: 39, end: 42 },
                    { text: "преследуя крики детей", start: 42, end: 44 },
                    { text: "в какой-то невидимой комнате,", start: 44, end: 46.5 },
                    { text: "всегда кажущейся такой близкой,", start: 46.5, end: 49 },
                    { text: "но почему-то недостижимой,", start: 49, end: 51.5 },
                    { text: "но вы никогда их не найдете.", start: 51.5, end: 54.5 },
                    { text: "Никто из вас не найдет.", start: 54.5, end: 57 },
                    { text: "Здесь ваша история заканчивается.", start: 57, end: 60 }
                ];
                
                this.currentState = 'hello';
                this.isPlaying = false;
                this.audio = new Audio();
                this.animationInterval = null;
                this.subtitleInterval = null;
                this.currentSubtitleIndex = -1;
                
                this.init();
            }
            
            init() {
                this.button.addEventListener('click', () => this.onButtonClick());
                
                this.audio.addEventListener('ended', () => this.onEnded());
                this.audio.addEventListener('error', (e) => this.onError(e));
                this.audio.addEventListener('timeupdate', () => this.onTimeUpdate());
                
                document.addEventListener('touchstart', () => {}, { once: true });
            }
            
            onButtonClick() {
                if (this.isPlaying) return;
                this.startPlayback();
            }
            
            startPlayback() {
                this.isPlaying = true;
                this.button.classList.add('playing');
                
                // Запускаем анимацию рта
                this.startMouthAnimation();
                
                // Если это вторая запись - запускаем динамические субтитры
                if (this.currentState === 'thanks') {
                    this.startDynamicSubtitles();
                }
                
                // Запускаем аудио
                const audioFile = this.audioFiles[this.currentState];
                this.audio.src = audioFile;
                this.audio.play().catch(e => {
                    console.log('Ошибка:', e);
                    this.stopPlayback();
                });
            }
            
            startDynamicSubtitles() {
                this.subtitles.classList.add('visible');
                this.currentSubtitleIndex = -1;
                
                // Обновляем субтитры каждые 100мс для точности
                this.subtitleInterval = setInterval(() => {
                    if (!this.isPlaying || !this.audio) return;
                    
                    const currentTime = this.audio.currentTime;
                    
                    // Ищем подходящий субтитр
                    let foundIndex = -1;
                    for (let i = 0; i < this.subtitleParts.length; i++) {
                        if (currentTime >= this.subtitleParts[i].start && 
                            currentTime < this.subtitleParts[i].end) {
                            foundIndex = i;
                            break;
                        }
                    }
                    
                    // Если нашли новый субтитр
                    if (foundIndex !== -1 && foundIndex !== this.currentSubtitleIndex) {
                        this.currentSubtitleIndex = foundIndex;
                        this.subtitles.textContent = this.subtitleParts[foundIndex].text;
                        this.subtitles.classList.add('fade-in');
                        
                        // Убираем класс анимации после завершения
                        setTimeout(() => {
                            this.subtitles.classList.remove('fade-in');
                        }, 300);
                        
                        // Обновляем таймер (опционально)
                        const totalParts = this.subtitleParts.length;
                        this.timer.textContent = `${foundIndex + 1}/${totalParts}`;
                    }
                    
                    // Если время вышло за последний субтитр
                    if (currentTime > this.subtitleParts[this.subtitleParts.length - 1].end) {
                        this.subtitles.textContent = this.subtitleParts[this.subtitleParts.length - 1].text;
                    }
                    
                }, 100); // Проверяем каждые 100мс
            }
            
            startMouthAnimation() {
                let isOpen = false;
                
                this.animationInterval = setInterval(() => {
                    if (!this.isPlaying) return;
                    
                    isOpen = !isOpen;
                    this.image.src = isOpen ? 'mouth-open.png' : 'mouth-closed.png';
                    
                    if (isOpen) {
                        this.image.style.filter = 'contrast(1.1) brightness(1)';
                    } else {
                        this.image.style.filter = 'contrast(1.05) brightness(0.95)';
                    }
                    
                }, 200);
            }
            
            stopMouthAnimation() {
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                this.image.src = 'mouth-closed.png';
                this.image.style.filter = 'contrast(1.05) brightness(0.95)';
            }
            
            stopDynamicSubtitles() {
                if (this.subtitleInterval) {
                    clearInterval(this.subtitleInterval);
                    this.subtitleInterval = null;
                }
                this.subtitles.classList.remove('visible');
                this.subtitles.textContent = '';
                this.timer.textContent = '';
                this.currentSubtitleIndex = -1;
            }
            
            onTimeUpdate() {
                // Дополнительная синхронизация если нужно
            }
            
            onEnded() {
                this.stopMouthAnimation();
                this.stopDynamicSubtitles();
                
                // Меняем состояние
                if (this.currentState === 'hello') {
                    this.currentState = 'thanks';
                    this.button.textContent = 'thanks';
                } else {
                    this.currentState = 'hello';
                    this.button.textContent = 'hello';
                }
                
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
            
            onError(e) {
                console.error('Ошибка:', e);
                this.stopMouthAnimation();
                this.stopDynamicSubtitles();
                this.button.classList.remove('playing');
                this.isPlaying = false;
                alert(`Файл ${this.audioFiles[this.currentState]} не найден!`);
            }
            
            stopPlayback() {
                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                }
                this.stopMouthAnimation();
                this.stopDynamicSubtitles();
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new DynamicSubtitles();
        });
    </script>
</body>
</html>
