<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Поздравительная открытка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            margin: 0;
            touch-action: manipulation;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 25px 20px;
            border-radius: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                       0 0 0 2px rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: clamp(28px, 8vw, 42px);
            margin-bottom: 20px;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            word-break: break-word;
        }

        .character-container {
            width: min(250px, 60vw);
            height: min(250px, 60vw);
            margin: 10px auto 20px;
            background: linear-gradient(145deg, #f0f0f0, #ffffff);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4),
                       inset 0 -5px 10px rgba(0,0,0,0.1);
            border: 4px solid white;
            transition: transform 0.2s ease;
            overflow: hidden;
        }

        .character-container:active {
            transform: scale(0.98);
        }

        .character-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Анимация для губ */
        .talking {
            animation: talk 0.15s infinite alternate;
        }

        @keyframes talk {
            from { transform: scaleY(1); }
            to { transform: scaleY(0.95); }
        }

        .speak-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: clamp(16px, 5vw, 20px) clamp(30px, 8vw, 50px);
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            margin: 15px auto;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5),
                       0 5px 10px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            touch-action: manipulation;
            -webkit-appearance: none;
            letter-spacing: 0.5px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .speak-button:active {
            transform: scale(0.97);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.7);
            background: linear-gradient(135deg, #5a6ad8 0%, #663d91 100%);
        }

        .speak-button.speaking {
            animation: pulse 1.2s infinite;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 10px 25px rgba(255, 107, 107, 0.5);
            }
            50% {
                box-shadow: 0 15px 35px rgba(255, 107, 107, 0.9);
            }
        }

        /* Индикатор загрузки аудио */
        .loading-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            color: #667eea;
            font-size: 16px;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Прогресс-бар для аудио */
        .audio-progress {
            width: 100%;
            height: 4px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Подсказка */
        .hint {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-top: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Кнопка выбора голоса (если несколько записей) */
        .voice-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .voice-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .voice-btn.active {
            background: #667eea;
            color: white;
        }

        .voice-btn:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 350px) {
            .card {
                padding: 15px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .speak-button {
                padding: 14px 20px;
                font-size: 16px;
            }
        }

        .no-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="card no-select">
        <h1>🎉 С ПРАЗДНИКОМ! 🎉</h1>
        
        <div class="character-container" id="characterContainer">
            <img class="character-image" id="character" src="mouth-closed.png" alt="Персонаж">
        </div>
        
        <!-- Выбор голоса (если несколько аудиофайлов) -->
        <div class="voice-selector" id="voiceSelector">
            <button class="voice-btn active" data-voice="voice1">Голос 1</button>
            <button class="voice-btn" data-voice="voice2">Голос 2</button>
        </div>
        
        <!-- Индикатор загрузки -->
        <div class="loading-indicator hidden" id="loadingIndicator">
            <div class="loading-spinner"></div>
            <span>Загрузка аудио...</span>
        </div>
        
        <!-- Прогресс воспроизведения -->
        <div class="audio-progress hidden" id="audioProgress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <button class="speak-button" id="speakButton">
            <span id="buttonText">🔊 Нажать для поздравления</span>
        </button>
        
        <div class="hint" id="hint">
            👆 Нажмите на кнопку или персонажа
        </div>
    </div>

    <script>
        class TalkingCharacterWithAudio {
            constructor() {
                this.character = document.getElementById('character');
                this.speakBtn = document.getElementById('speakButton');
                this.buttonText = document.getElementById('buttonText');
                this.characterContainer = document.getElementById('characterContainer');
                this.hint = document.getElementById('hint');
                this.loadingIndicator = document.getElementById('loadingIndicator');
                this.audioProgress = document.getElementById('audioProgress');
                this.progressBar = document.getElementById('progressBar');
                this.voiceSelector = document.getElementById('voiceSelector');
                
                // Настройка аудиофайлов
                this.audioFiles = {
                    voice1: 'congratulation1.mp3',  // Замените на свои файлы
                    voice2: 'congratulation2.mp3'   // Замените на свои файлы
                };
                
                this.currentVoice = 'voice1';
                this.audio = new Audio();
                this.isPlaying = false;
                this.animationInterval = null;
                
                // Предзагрузка аудио
                this.preloadAudio();
                
                this.init();
            }
            
            init() {
                // Обработчики событий
                this.speakBtn.addEventListener('click', (e) => this.togglePlayback(e));
                this.characterContainer.addEventListener('click', () => this.togglePlayback());
                
                // Выбор голоса
                document.querySelectorAll('.voice-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentVoice = btn.dataset.voice;
                        
                        // Если сейчас играет, переключаем на новый голос
                        if (this.isPlaying) {
                            this.stopPlayback();
                            this.startPlayback();
                        }
                    });
                });
                
                // События аудио
                this.audio.addEventListener('play', () => this.onPlay());
                this.audio.addEventListener('pause', () => this.onPause());
                this.audio.addEventListener('ended', () => this.onEnded());
                this.audio.addEventListener('timeupdate', () => this.onTimeUpdate());
                this.audio.addEventListener('error', (e) => this.onError(e));
                this.audio.addEventListener('waiting', () => this.onWaiting());
                this.audio.addEventListener('canplay', () => this.onCanPlay());
                
                // Для мобильных устройств
                document.addEventListener('touchstart', () => {
                    // Разрешаем аудио на мобильных устройствах
                }, { once: true });
            }
            
            preloadAudio() {
                // Предзагружаем первый файл
                this.audio.src = this.audioFiles[this.currentVoice];
                this.audio.load();
            }
            
            togglePlayback() {
                if (this.isPlaying) {
                    this.stopPlayback();
                } else {
                    this.startPlayback();
                }
            }
            
            startPlayback() {
                if (this.isPlaying) return;
                
                this.showLoading(true);
                
                // Устанавливаем текущий аудиофайл
                if (this.audio.src !== this.audioFiles[this.currentVoice]) {
                    this.audio.src = this.audioFiles[this.currentVoice];
                    this.audio.load();
                }
                
                // Пытаемся воспроизвести
                const playPromise = this.audio.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log('Ошибка воспроизведения:', error);
                        this.showLoading(false);
                        
                        // Для iOS показываем подсказку
                        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
                            alert('Нажмите на экран еще раз, чтобы разрешить звук');
                        }
                    });
                }
            }
            
            stopPlayback() {
                this.audio.pause();
                this.audio.currentTime = 0;
                this.stopAnimation();
                this.updateUIForStop();
            }
            
            onPlay() {
                this.isPlaying = true;
                this.showLoading(false);
                this.audioProgress.classList.remove('hidden');
                this.speakBtn.classList.add('speaking');
                this.buttonText.innerHTML = '⏹ Остановить';
                this.hint.innerHTML = '👆 Нажмите, чтобы остановить';
                this.startAnimation();
            }
            
            onPause() {
                this.stopAnimation();
                this.updateUIForStop();
            }
            
            onEnded() {
                this.stopAnimation();
                this.updateUIForStop();
                this.audioProgress.classList.add('hidden');
                this.progressBar.style.width = '0%';
            }
            
            onTimeUpdate() {
                if (this.audio.duration) {
                    const progress = (this.audio.currentTime / this.audio.duration) * 100;
                    this.progressBar.style.width = progress + '%';
                }
            }
            
            onError(e) {
                console.error('Ошибка аудио:', e);
                this.showLoading(false);
                alert('Не удалось загрузить аудиофайл. Проверьте наличие файла: ' + this.audioFiles[this.currentVoice]);
                this.updateUIForStop();
            }
            
            onWaiting() {
                this.showLoading(true);
            }
            
            onCanPlay() {
                this.showLoading(false);
            }
            
            startAnimation() {
                // Анимация смены рта
                let mouthOpen = false;
                
                this.animationInterval = setInterval(() => {
                    // Синхронизируем с речью (частота смены рта)
                    if (this.audio.played.length > 0 && !this.audio.paused) {
                        mouthOpen = !mouthOpen;
                        this.character.src = mouthOpen ? 'mouth-open.png' : 'mouth-closed.png';
                        
                        // Добавляем небольшую анимацию
                        if (mouthOpen) {
                            this.character.style.transform = 'scale(1.02)';
                        } else {
                            this.character.style.transform = 'scale(1)';
                        }
                    }
                }, 120); // ~8 кадров в секунду
            }
            
            stopAnimation() {
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                this.character.src = 'mouth-closed.png';
                this.character.style.transform = 'scale(1)';
            }
            
            updateUIForStop() {
                this.isPlaying = false;
                this.speakBtn.classList.remove('speaking');
                this.buttonText.innerHTML = '🔊 Нажать для поздравления';
                this.hint.innerHTML = '👆 Нажмите на кнопку или персонажа';
            }
            
            showLoading(show) {
                if (show) {
                    this.loadingIndicator.classList.remove('hidden');
                } else {
                    this.loadingIndicator.classList.add('hidden');
                }
            }
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            new TalkingCharacterWithAudio();
        });
    </script>
</body>
</html>
