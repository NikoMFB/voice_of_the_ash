<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPEN ME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Courier', monospace;
            touch-action: manipulation;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            position: relative;
            overflow: hidden;
            background: #000;
            margin: 0 auto;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.5s ease;
        }

        #page1 {
            opacity: 1;
            z-index: 2;
        }

        #page1.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #page2 {
            background: linear-gradient(145deg, #fff0f5 0%, #ffe4ec 50%, #ffd9e6 100%);
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        #page2.visible {
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }

        /* Эффект выключения монитора */
        .crt-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9998;
            pointer-events: none;
            opacity: 0;
        }

        .crt-effect.active {
            animation: crtShutdown 0.5s forwards;
        }

        @keyframes crtShutdown {
            0% { opacity: 0; transform: scale(1); }
            10% { opacity: 0.8; transform: scale(0.98); }
            20% { opacity: 1; transform: scale(0.95); }
            30% { opacity: 0.9; transform: scale(0.9) skewX(2deg); }
            40% { opacity: 1; transform: scale(0.85) skewX(-2deg); }
            50% { opacity: 0.7; transform: scale(0.8) skewX(3deg); filter: brightness(2); }
            60% { opacity: 0.9; transform: scale(0.7); filter: brightness(1); }
            70% { opacity: 0.5; transform: scale(0.5) skewX(-5deg); }
            80% { opacity: 0.8; transform: scale(0.3); filter: brightness(0.5); }
            90% { opacity: 0.3; transform: scale(0.1); }
            100% { opacity: 0; transform: scale(0); }
        }

        /* Крестик - убрал кружок, просто крестик */
        .skip-cross {
            position: absolute;
            top: 60px;
            right: 25px;
            color: rgba(255, 255, 255, 0.2); /* Прозрачность 20% */
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-size: 36px;
            font-weight: 300;
            cursor: pointer;
            z-index: 10000;
            user-select: none;
            line-height: 1;
            transition: opacity 0.2s ease;
            pointer-events: auto;
            text-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .skip-cross:hover,
        .skip-cross:active {
            color: rgba(255, 255, 255, 0.4);
        }

        /* СТРАНИЦА 1: ХОРРОР (без VHS) */
        .horror-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #characterImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, 
                        transparent 40%, 
                        rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 2;
        }

        .subtitles-container {
            position: absolute;
            bottom: 180px;
            left: 0;
            width: 100%;
            padding: 0 25px;
            z-index: 20;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .subtitles {
            color: #f0e68c;
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 1px;
            max-width: 100%;
            width: 100%;
            opacity: 0;
            transition: opacity 0.15s ease;
            text-transform: uppercase;
        }

        .subtitles.visible {
            opacity: 1;
        }

        .bottom-area {
            position: absolute;
            bottom: 70px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 30;
            pointer-events: none;
        }

        .action-button {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 240, 0.25);
            color: rgba(255, 255, 240, 0.9);
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 22px;
            letter-spacing: 3px;
            padding: 12px 40px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
            text-transform: lowercase;
            min-width: 180px;
            text-align: center;
            position: relative;
            z-index: 31;
        }

        .action-button.playing {
            background: rgba(255, 255, 200, 0.2);
            border: 1px solid rgba(255, 255, 200, 0.4);
        }

        /* СТРАНИЦА 2: ДЕВИЧНИК */
        .party-page {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #fff0f5 0%, #ffe4ec 50%, #ffd9e6 100%);
            cursor: pointer;
        }

        /* Контейнер для Three.js */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }

        /* Украшения */
        .decoration {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            color: rgba(255, 200, 220, 0.7);
            font-size: 24px;
            animation: floatDecoration 6s ease-in-out infinite;
            filter: drop-shadow(0 0 5px rgba(255, 150, 200, 0.5));
        }

        @keyframes floatDecoration {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(10px, -15px) rotate(10deg); }
            66% { transform: translate(-10px, -5px) rotate(-5deg); }
        }

        .star1 { top: 10%; left: 5%; animation-delay: 0s; font-size: 28px; }
        .star2 { top: 20%; right: 8%; animation-delay: 1s; font-size: 22px; }
        .star3 { bottom: 25%; left: 12%; animation-delay: 2s; font-size: 32px; }
        .heart1 { top: 15%; right: 15%; animation-delay: 1.5s; font-size: 30px; color: #ffb6c1; }
        .heart2 { bottom: 30%; right: 20%; animation-delay: 0.5s; font-size: 26px; color: #ffb6c1; }
        .heart3 { top: 40%; left: 8%; animation-delay: 2.5s; font-size: 24px; color: #ffb6c1; }
        .balloon1 { top: 30%; right: 10%; animation-delay: 1s; font-size: 35px; }
        .balloon2 { bottom: 15%; left: 15%; animation-delay: 2s; font-size: 30px; }
        .balloon3 { top: 60%; right: 15%; animation-delay: 0.3s; font-size: 28px; }
        .sparkle1 { bottom: 40%; left: 20%; animation-delay: 1.2s; font-size: 20px; }
        .sparkle2 { top: 70%; right: 5%; animation-delay: 2.2s; font-size: 18px; }

        /* Поздравление */
        .birthday-message {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 15;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            color: #ff8da1;
            text-shadow: 2px 2px 0 #ffffff, 4px 4px 0 rgba(255, 150, 200, 0.3);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: messageGlow 3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes messageGlow {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); text-shadow: 3px 3px 0 #ffffff, 6px 6px 0 rgba(255, 150, 200, 0.5); }
        }

        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff8da1;
            font-family: 'Comic Sans MS', cursive;
            font-size: 16px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        /* Подсказка что можно кликнуть на голову */
        .click-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-family: 'Comic Sans MS', cursive;
            z-index: 30;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            animation: hintPulse 2s infinite;
            pointer-events: none;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <!-- Эффект перехода -->
    <div class="crt-effect" id="crtEffect"></div>

    <div class="game-container">
        <!-- СТРАНИЦА 1: ХОРРОР (БЕЗ VHS) -->
        <div class="page" id="page1">
            <!-- Крестик - просто символ, без фона -->
            <div class="skip-cross" id="skipButton">✕</div>
            
            <div class="horror-container">
                <img src="mouth-closed.png" alt="" id="characterImage">
                <div class="vignette"></div>
            </div>
            
            <div class="subtitles-container">
                <div class="subtitles" id="subtitles"></div>
            </div>
            
            <div class="bottom-area">
                <button class="action-button" id="actionButton">
                    hello
                </button>
            </div>
        </div>

        <!-- СТРАНИЦА 2: ДЕВИЧНИК С КЛИКАБЕЛЬНОЙ ГОЛОВОЙ -->
        <div class="page" id="page2">
            <div class="party-page" id="partyPage">
                <div id="canvas-container"></div>
                
                <!-- Украшения -->
                <div class="decoration star1">✨</div>
                <div class="decoration star2">⭐</div>
                <div class="decoration star3">🌟</div>
                <div class="decoration heart1">❤️</div>
                <div class="decoration heart2">💖</div>
                <div class="decoration heart3">💗</div>
                <div class="decoration balloon1">🎈</div>
                <div class="decoration balloon2">🎈</div>
                <div class="decoration balloon3">🎈</div>
                <div class="decoration sparkle1">💫</div>
                <div class="decoration sparkle2">✨</div>
                
                <div class="birthday-message">С Днём Рождения, Мелина! 🎀</div>
                
                <!-- Подсказка для клика -->
                <div class="click-hint" id="clickHint">👆 нажми на голову</div>
                
                <div class="loader" id="modelLoader">✨ загружаем ✨</div>
            </div>
        </div>
    </div>

    <!-- Подключаем Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        class BirthdayParty {
            constructor() {
                // Элементы
                this.image = document.getElementById('characterImage');
                this.button = document.getElementById('actionButton');
                this.subtitles = document.getElementById('subtitles');
                this.page1 = document.getElementById('page1');
                this.page2 = document.getElementById('page2');
                this.crtEffect = document.getElementById('crtEffect');
                this.loader = document.getElementById('modelLoader');
                this.skipButton = document.getElementById('skipButton');
                this.partyPage = document.getElementById('partyPage');
                this.clickHint = document.getElementById('clickHint');
                
                // Аудио файлы
                this.audioFiles = {
                    hello: 'voice1.mp3',
                    thanks: 'voice2.mp3'
                };
                
                // Фоновая музыка
                this.bgMusic = new Audio('birthday-music.mp3');
                this.bgMusic.loop = true;
                this.bgMusic.volume = 0.4;
                
                // Субтитры
                this.subtitleParts = [
                    { text: "Соединение прервано.", start: 0, end: 2.5 },
                    { text: "Мне жаль, что я прерываю вас, Мелина,", start: 2.5, end: 5.5 },
                    { text: "если вы еще помните это имя,", start: 5.5, end: 8 },
                    { text: "но боюсь, вас дезинформировали.", start: 8, end: 10.5 },
                    { text: "Вы здесь не для того,", start: 10.5, end: 12.5 },
                    { text: "чтобы получить подарок,", start: 12.5, end: 14.5 },
                    { text: "и вас не позвал сюда человек,", start: 14.5, end: 17 },
                    { text: "которого вы предполагаете,", start: 17, end: 19 },
                    { text: "хотя вас действительно позвали.", start: 19, end: 21.5 },
                    { text: "Вы все были вызваны сюда,", start: 21.5, end: 24 },
                    { text: "в лабиринт звуков и запахов,", start: 24, end: 26.5 },
                    { text: "дезинформации и несчастий.", start: 26.5, end: 29 },
                    { text: "Лабиринт без выхода,", start: 29, end: 31 },
                    { text: "лабиринт без приза.", start: 31, end: 33 },
                    { text: "Вы даже не понимаете,", start: 33, end: 35 },
                    { text: "что попали в ловушку.", start: 35, end: 37 },
                    { text: "Ваша жажда крови", start: 37, end: 39 },
                    { text: "загнала вас в бесконечные круги,", start: 39, end: 42 },
                    { text: "преследуя крики детей", start: 42, end: 44 },
                    { text: "в какой-то невидимой комнате,", start: 44, end: 46.5 },
                    { text: "всегда кажущейся такой близкой,", start: 46.5, end: 49 },
                    { text: "но почему-то недостижимой,", start: 49, end: 51.5 },
                    { text: "но вы никогда их не найдете.", start: 51.5, end: 54.5 },
                    { text: "Никто из вас не найдет.", start: 54.5, end: 57 },
                    { text: "Здесь ваша история заканчивается.", start: 57, end: 60 }
                ];
                
                this.currentState = 'hello';
                this.isPlaying = false;
                this.audio = new Audio();
                this.animationInterval = null;
                this.subtitleInterval = null;
                this.currentSubtitleIndex = -1;
                this.hasSecondEnded = false;
                
                // 3D переменные
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.model = null;
                this.clock = new THREE.Clock();
                this.originalScale = 1;
                this.isAnimating = false;
                
                // Raycaster для определения клика по 3D модели
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                
                this.init();
            }
            
            init() {
                console.log('Инициализация...');
                
                // Проверяем что элементы существуют
                if (this.button) {
                    this.button.addEventListener('click', () => this.onButtonClick());
                    console.log('Кнопка найдена');
                } else {
                    console.error('Кнопка не найдена!');
                }
                
                if (this.skipButton) {
                    this.skipButton.addEventListener('click', () => this.skipToParty());
                    console.log('Крестик найден');
                } else {
                    console.error('Крестик не найден!');
                }
                
                this.audio.addEventListener('ended', () => this.onEnded());
                this.audio.addEventListener('error', (e) => this.onError(e));
                
                document.addEventListener('touchstart', () => {}, { once: true });
            }
            
            skipToParty() {
                console.log('Переход по крестику');
                if (this.isPlaying) {
                    this.stopPlayback();
                }
                this.playTransition();
            }
            
            onButtonClick() {
                console.log('Кнопка нажата');
                if (this.isPlaying) return;
                this.startPlayback();
            }
            
            startPlayback() {
                console.log('Старт воспроизведения, состояние:', this.currentState);
                this.isPlaying = true;
                this.button.classList.add('playing');
                
                this.startMouthAnimation();
                
                if (this.currentState === 'thanks') {
                    this.startSubtitles();
                }
                
                const audioFile = this.audioFiles[this.currentState];
                console.log('Загружаем аудио:', audioFile);
                this.audio.src = audioFile;
                this.audio.play().catch(e => {
                    console.log('Ошибка воспроизведения:', e);
                    this.stopPlayback();
                });
            }
            
            startSubtitles() {
                this.subtitles.classList.add('visible');
                this.currentSubtitleIndex = -1;
                
                this.subtitleInterval = setInterval(() => {
                    if (!this.isPlaying || !this.audio) return;
                    
                    const currentTime = this.audio.currentTime;
                    
                    for (let i = 0; i < this.subtitleParts.length; i++) {
                        if (currentTime >= this.subtitleParts[i].start && 
                            currentTime < this.subtitleParts[i].end) {
                            
                            if (i !== this.currentSubtitleIndex) {
                                this.currentSubtitleIndex = i;
                                this.subtitles.textContent = this.subtitleParts[i].text;
                            }
                            break;
                        }
                    }
                }, 100);
            }
            
            startMouthAnimation() {
                let isOpen = false;
                
                this.animationInterval = setInterval(() => {
                    if (!this.isPlaying) return;
                    isOpen = !isOpen;
                    this.image.src = isOpen ? 'mouth-open.png' : 'mouth-closed.png';
                }, 200);
            }
            
            stopMouthAnimation() {
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                this.image.src = 'mouth-closed.png';
            }
            
            stopSubtitles() {
                if (this.subtitleInterval) {
                    clearInterval(this.subtitleInterval);
                    this.subtitleInterval = null;
                }
                this.subtitles.classList.remove('visible');
                this.subtitles.textContent = '';
                this.currentSubtitleIndex = -1;
            }
            
            // Функция анимации нажатия на голову
            animateHeadClick() {
                if (this.isAnimating || !this.model) return;
                
                console.log('Клик по голове!');
                this.isAnimating = true;
                
                // Запоминаем начальный масштаб
                this.originalScale = this.model.scale.x;
                
                // Анимация: увеличиваем на 10% (1.1), потом уменьшаем на 15% от увеличенного (0.935), потом возвращаем
                let progress = 0;
                const duration = 600; // 0.6 секунды
                const startTime = performance.now();
                
                const animate = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    progress = Math.min(elapsed / duration, 1);
                    
                    if (progress < 0.33) {
                        // Первая треть: увеличение до 1.1
                        const t = progress * 3;
                        const scale = this.originalScale + (t * this.originalScale * 0.1);
                        this.model.scale.set(scale, scale, scale);
                    } else if (progress < 0.66) {
                        // Вторая треть: уменьшение до 0.935 от увеличенного
                        const t = (progress - 0.33) * 3;
                        const scale = this.originalScale * 1.1 - (t * this.originalScale * 0.165);
                        this.model.scale.set(scale, scale, scale);
                    } else {
                        // Последняя треть: возврат к исходному
                        const t = (progress - 0.66) * 3;
                        const scale = this.originalScale * 0.935 + (t * this.originalScale * 0.065);
                        this.model.scale.set(scale, scale, scale);
                    }
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        // Возвращаем точный масштаб
                        this.model.scale.set(this.originalScale, this.originalScale, this.originalScale);
                        this.isAnimating = false;
                        
                        // Прячем подсказку после первого клика
                        if (this.clickHint) {
                            this.clickHint.style.opacity = '0';
                            setTimeout(() => {
                                if (this.clickHint) this.clickHint.style.display = 'none';
                            }, 1000);
                        }
                    }
                };
                
                requestAnimationFrame(animate);
            }
            
            // Обработчик клика по 3D сцене
            onCanvasClick(event) {
                if (!this.model || this.isAnimating) return;
                
                // Получаем координаты клика относительно canvas
                const rect = this.renderer.domElement.getBoundingClientRect();
                
                // Нормализованные координаты для raycaster (-1 до 1)
                this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                
                // Обновляем raycaster
                this.raycaster.setFromCamera(this.mouse, this.camera);
                
                // Проверяем пересечения с моделью
                const intersects = this.raycaster.intersectObject(this.model, true);
                
                if (intersects.length > 0) {
                    // Кликнули по голове!
                    this.animateHeadClick();
                }
            }
            
            // 3D анимация
            init3D() {
                console.log('Инициализация 3D');
                const container = document.getElementById('canvas-container');
                
                if (!container) {
                    console.error('Canvas container не найден!');
                    return;
                }
                
                // Сцена
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0xfff0f5);
                
                // Камера
                this.camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
                this.camera.position.set(0, 0, 15);
                
                // Рендерер
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(container.clientWidth, container.clientHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(this.renderer.domElement);
                
                // Добавляем обработчик клика на canvas
                this.renderer.domElement.style.cursor = 'pointer';
                this.renderer.domElement.addEventListener('click', (e) => this.onCanvasClick(e));
                this.renderer.domElement.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.onCanvasClick(e.touches[0]);
                });
                
                // МЯГКОЕ МАТОВОЕ ОСВЕЩЕНИЕ
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);
                
                const topLight = new THREE.DirectionalLight(0xffffff, 0.5);

                        this.model = gltf.scene;
                        
                        // Центрируем и масштабируем
                        const box = new THREE.Box3().setFromObject(this.model);
                        const center = box.getCenter(new THREE.Vector3());
                        this.model.position.sub(center);
                        
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 2.2 / maxDim;
                        this.model.scale.set(scale, scale, scale);
                        this.originalScale = scale;
                        
                        this.scene.add(this.model);
                        
                        if (this.loader) {
                            this.loader.style.display = 'none';
                        }
                        
                        this.bgMusic.play().catch(e => console.log('Музыка ждет взаимодействия'));
                    },
                    (xhr) => {

                        if (this.loader) {
                            this.loader.textContent = `✨ ${percent}% ✨`;
                        }
                    },
                    (error) => {
                        console.error('Ошибка загрузки модели:', error);
                        this.createPlaceholderHead();
                    }
                );
                
                this.animate();
                
                window.addEventListener('resize', () => this.onWindowResize());
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                
                if (this.model && !this.isAnimating) {
                    // Вращение на 10% быстрее
                    this.model.rotation.y += 0.0033;
                    
                    // Плавное покачивание
                    const time = this.clock.getElapsedTime();
                    this.model.position.y = Math.sin(time * 1.2) * 0.15;
                    this.model.rotation.x = Math.sin(time * 0.4) * 0.03;
                    this.model.rotation.z = Math.sin(time * 0.6) * 0.03;
                }
                
                this.renderer.render(this.scene, this.camera);
            }
            
            onWindowResize() {
                const container = document.getElementById('canvas-container');
                if (this.camera && this.renderer && container) {
                    this.camera.aspect = container.clientWidth / container.clientHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(container.clientWidth, container.clientHeight);
                }
            }

                        this.playTransition();
                    }
                    this.currentState = 'hello';
                    this.button.textContent = 'hello';
                }
                
                this.button.classList.remove('playing');
                this.isPlaying = false;
