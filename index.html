<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPEN ME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            min-height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            touch-action: manipulation;
            padding: 0;
            margin: 0;
        }

        /* Еле заметный шум */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.02) 0px,
                rgba(255, 255, 255, 0.02) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            max-height: 900px;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* Основное изображение на весь экран */
        .fullscreen-image {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #characterImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: contrast(1.05) brightness(0.95);
            image-rendering: crisp-edges;
        }

        /* Еле заметный виньет */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, 
                        transparent 40%, 
                        rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* Нижняя область для кнопки */
        .bottom-area {
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        /* Кнопка в стиле Outlast */
        .action-button {
            background: rgba(255, 255, 255, 0.18); /* 18% прозрачности */
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-family: 'Arial', 'Helvetica', sans-serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2px;
            padding: 12px 40px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: all 0.2s ease;
            text-transform: lowercase;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            min-width: 200px;
            text-align: center;
        }

        .action-button:hover {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .action-button:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.98);
        }

        /* Легкое свечение во время воспроизведения */
        .action-button.playing {
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            animation: breathe 2s infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        /* Маленький индикатор состояния (очень тонкий) */
        .state-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            font-family: 'Arial', monospace;
            letter-spacing: 1px;
            z-index: 5;
        }

        /* Для мобильных */
        @media (max-width: 400px) {
            .action-button {
                font-size: 20px;
                padding: 10px 30px;
                min-width: 160px;
            }
            
            .bottom-area {
                bottom: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Основное изображение -->
        <div class="fullscreen-image">
            <img src="mouth-closed.png" alt="" id="characterImage">
        </div>
        
        <!-- Виньетка для глубины -->
        <div class="vignette"></div>
        
        <!-- Тонкий индикатор -->
        <div class="state-indicator" id="stateIndicator">[ standby ]</div>
        
        <!-- Кнопка -->
        <div class="bottom-area">
            <button class="action-button" id="actionButton">
                hello
            </button>
        </div>
    </div>

    <script>
        class OutlastStyle {
            constructor() {
                // Элементы
                this.image = document.getElementById('characterImage');
                this.button = document.getElementById('actionButton');
                this.indicator = document.getElementById('stateIndicator');
                
                // Аудио файлы
                this.audioFiles = {
                    hello: 'voice1.mp3',   // первая запись
                    thanks: 'voice2.mp3'    // вторая запись
                };
                
                this.currentState = 'hello'; // 'hello' или 'thanks'
                this.isPlaying = false;
                this.audio = new Audio();
                this.animationInterval = null;
                
                this.init();
            }
            
            init() {
                // Обработчик кнопки
                this.button.addEventListener('click', () => this.onButtonClick());
                
                // События аудио
                this.audio.addEventListener('ended', () => this.onEnded());
                this.audio.addEventListener('error', (e) => this.onError(e));
                
                // Для мобильных устройств
                document.addEventListener('touchstart', () => {
                    // Активация аудио на iOS
                }, { once: true });
            }
            
            onButtonClick() {
                // Если играет, не даем нажать снова
                if (this.isPlaying) return;
                
                // Проигрываем текущее состояние
                this.startPlayback();
            }
            
            startPlayback() {
                this.isPlaying = true;
                
                // Меняем индикатор
                this.indicator.textContent = '[ playing ]';
                
                // Добавляем класс анимации к кнопке
                this.button.classList.add('playing');
                
                // Запускаем анимацию рта (0.5 секунды между кадрами)
                this.startMouthAnimation();
                
                // Запускаем аудио
                const audioFile = this.audioFiles[this.currentState];
                this.audio.src = audioFile;
                this.audio.play().catch(e => {
                    console.log('Ошибка воспроизведения:', e);
                    this.stopPlayback();
                    this.indicator.textContent = '[ error ]';
                });
            }
            
            startMouthAnimation() {
                let isOpen = false;
                
                this.animationInterval = setInterval(() => {
                    if (!this.isPlaying) return;
                    
                    // Меняем состояние рта каждые 0.5 секунд
                    isOpen = !isOpen;
                    this.image.src = isOpen ? 'mouth-open.png' : 'mouth-closed.png';
                    
                    // Добавляем микро-эффект при смене
                    if (isOpen) {
                        this.image.style.filter = 'contrast(1.1) brightness(1)';
                    } else {
                        this.image.style.filter = 'contrast(1.05) brightness(0.95)';
                    }
                    
                }, 500); // 0.5 секунды
            }
            
            stopMouthAnimation() {
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                this.image.src = 'mouth-closed.png';
                this.image.style.filter = 'contrast(1.05) brightness(0.95)';
            }
            
            onEnded() {
                console.log('Playback ended, state:', this.currentState);
                
                // Останавливаем анимацию
                this.stopMouthAnimation();
                
                // Меняем состояние
                if (this.currentState === 'hello') {
                    // После hello переключаем на thanks
                    this.currentState = 'thanks';
                    this.button.textContent = 'thanks';
                    this.indicator.textContent = '[ ready ]';
                } else {
                    // После thanks возвращаем на hello
                    this.currentState = 'hello';
                    this.button.textContent = 'hello';
                    this.indicator.textContent = '[ standby ]';
                }
                
                // Убираем класс анимации
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
            
            onError(e) {
                console.error('Ошибка аудио:', e);
                this.stopMouthAnimation();
                this.button.classList.remove('playing');
                this.indicator.textContent = '[ file error ]';
                this.isPlaying = false;
                
                // Проверка на наличие файлов
                const fileName = this.audioFiles[this.currentState];
                alert(`Файл ${fileName} не найден. Проверьте название файла!`);
            }
            
            stopPlayback() {
                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                }
                this.stopMouthAnimation();
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', () => {
            new OutlastStyle();
        });
    </script>
</body>
</html>
