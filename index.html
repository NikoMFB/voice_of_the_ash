<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPEN ME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Courier', monospace;
            touch-action: manipulation;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            position: relative;
            overflow: hidden;
            background: #000;
            margin: 0 auto;
        }

        /* Страница 1 - Хоррор */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.5s ease;
        }

        #page1 {
            opacity: 1;
            z-index: 2;
        }

        #page1.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Страница 2 - Аниме с 3D */
        #page2 {
            background: white;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        #page2.visible {
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }

        /* Эффект выключения монитора */
        .crt-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .crt-effect.active {
            animation: crtShutdown 0.5s forwards;
        }

        @keyframes crtShutdown {
            0% { opacity: 0; transform: scale(1); }
            10% { opacity: 0.8; transform: scale(0.98); }
            20% { opacity: 1; transform: scale(0.95); }
            30% { opacity: 0.9; transform: scale(0.9) skewX(2deg); }
            40% { opacity: 1; transform: scale(0.85) skewX(-2deg); }
            50% { opacity: 0.7; transform: scale(0.8) skewX(3deg); filter: brightness(2); }
            60% { opacity: 0.9; transform: scale(0.7); filter: brightness(1); }
            70% { opacity: 0.5; transform: scale(0.5) skewX(-5deg); }
            80% { opacity: 0.8; transform: scale(0.3); filter: brightness(0.5); }
            90% { opacity: 0.3; transform: scale(0.1); }
            100% { opacity: 0; transform: scale(0); }
        }

        /* ======= СТРАНИЦА 1 (ХОРРОР) ======= */
        .fullscreen-image {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #characterImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, 
                        transparent 40%, 
                        rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 3;
        }

        .subtitles-container {
            position: absolute;
            bottom: 180px;
            left: 0;
            width: 100%;
            padding: 0 25px;
            z-index: 20;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .subtitles {
            color: #f0e68c;
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 1px;
            max-width: 100%;
            width: 100%;
            opacity: 0;
            transition: opacity 0.15s ease;
            text-transform: uppercase;
        }

        .subtitles.visible {
            opacity: 1;
        }

        .bottom-area {
            position: absolute;
            bottom: 70px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .action-button {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 240, 0.25);
            color: rgba(255, 255, 240, 0.9);
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 22px;
            letter-spacing: 3px;
            padding: 12px 40px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
            text-transform: lowercase;
            min-width: 180px;
            text-align: center;
        }

        .action-button.playing {
            background: rgba(255, 255, 200, 0.2);
            border: 1px solid rgba(255, 255, 200, 0.4);
        }

        /* ======= СТРАНИЦА 2 (3D АНИМЕ) ======= */
        .anime-page {
            background: white;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Контейнер для Three.js */
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Кнопка возврата */
        .return-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: #666;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            padding: 10px 25px;
            cursor: pointer;
            z-index: 100;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .return-button:hover {
            background: rgba(0, 0, 0, 0.2);
            color: #333;
        }

        /* Загрузчик */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Эффекты перехода -->
    <div class="crt-effect" id="crtEffect"></div>

    <div class="game-container">
        <!-- СТРАНИЦА 1: ХОРРОР -->
        <div class="page" id="page1">
            <div class="fullscreen-image">
                <img src="mouth-closed.png" alt="" id="characterImage">
            </div>
            <div class="vignette"></div>
            
            <div class="subtitles-container">
                <div class="subtitles" id="subtitles"></div>
            </div>
            
            <div class="bottom-area">
                <button class="action-button" id="actionButton">
                    hello
                </button>
            </div>
        </div>

        <!-- СТРАНИЦА 2: 3D АНИМЕ -->
        <div class="page" id="page2">
            <div class="anime-page">
                <!-- Контейнер для Three.js -->
                <div id="canvas-container"></div>
                <div class="loader" id="modelLoader">Загрузка 3D модели...</div>
                
                <!-- Кнопка возврата -->
                <button class="return-button" id="returnButton" onclick="location.reload()">
                    ↩ вернуться
                </button>
            </div>
        </div>
    </div>

    <!-- Подключаем Three.js и загрузчик GLTF -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ========== ОСНОВНОЙ КЛАСС ==========
        class HorrorTo3DAnime {
            constructor() {
                // Элементы
                this.image = document.getElementById('characterImage');
                this.button = document.getElementById('actionButton');
                this.subtitles = document.getElementById('subtitles');
                this.page1 = document.getElementById('page1');
                this.page2 = document.getElementById('page2');
                this.crtEffect = document.getElementById('crtEffect');
                this.loader = document.getElementById('modelLoader');
                
                // Аудио файлы
                this.audioFiles = {
                    hello: 'voice1.mp3',
                    thanks: 'voice2.mp3'
                };
                
                // Субтитры
                this.subtitleParts = [
                    { text: "Соединение прервано.", start: 0, end: 2.5 },
                    { text: "Мне жаль, что я прерываю вас, Мелина,", start: 2.5, end: 5.5 },
                    { text: "если вы еще помните это имя,", start: 5.5, end: 8 },
                    { text: "но боюсь, вас дезинформировали.", start: 8, end: 10.5 },
                    { text: "Вы здесь не для того,", start: 10.5, end: 12.5 },
                    { text: "чтобы получить подарок,", start: 12.5, end: 14.5 },
                    { text: "и вас не позвал сюда человек,", start: 14.5, end: 17 },
                    { text: "которого вы предполагаете,", start: 17, end: 19 },
                    { text: "хотя вас действительно позвали.", start: 19, end: 21.5 },
                    { text: "Вы все были вызваны сюда,", start: 21.5, end: 24 },
                    { text: "в лабиринт звуков и запахов,", start: 24, end: 26.5 },
                    { text: "дезинформации и несчастий.", start: 26.5, end: 29 },
                    { text: "Лабиринт без выхода,", start: 29, end: 31 },
                    { text: "лабиринт без приза.", start: 31, end: 33 },
                    { text: "Вы даже не понимаете,", start: 33, end: 35 },
                    { text: "что попали в ловушку.", start: 35, end: 37 },
                    { text: "Ваша жажда крови", start: 37, end: 39 },
                    { text: "загнала вас в бесконечные круги,", start: 39, end: 42 },
                    { text: "преследуя крики детей", start: 42, end: 44 },
                    { text: "в какой-то невидимой комнате,", start: 44, end: 46.5 },
                    { text: "всегда кажущейся такой близкой,", start: 46.5, end: 49 },
                    { text: "но почему-то недостижимой,", start: 49, end: 51.5 },
                    { text: "но вы никогда их не найдете.", start: 51.5, end: 54.5 },
                    { text: "Никто из вас не найдет.", start: 54.5, end: 57 },
                    { text: "Здесь ваша история заканчивается.", start: 57, end: 60 }
                ];
                
                this.currentState = 'hello';
                this.isPlaying = false;
                this.audio = new Audio();
                this.animationInterval = null;
                this.subtitleInterval = null;
                this.currentSubtitleIndex = -1;
                this.hasSecondEnded = false;
                
                // 3D переменные
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.model = null;
                this.clock = new THREE.Clock();
                
                this.init();
            }
            
            init() {
                this.button.addEventListener('click', () => this.onButtonClick());
                
                this.audio.addEventListener('ended', () => this.onEnded());
                this.audio.addEventListener('error', (e) => this.onError(e));
                
                document.addEventListener('touchstart', () => {}, { once: true });
            }
            
            onButtonClick() {
                if (this.isPlaying) return;
                this.startPlayback();
            }
            
            startPlayback() {
                this.isPlaying = true;
                this.button.classList.add('playing');
                
                this.startMouthAnimation();
                
                if (this.currentState === 'thanks') {
                    this.startSubtitles();
                }
                
                const audioFile = this.audioFiles[this.currentState];
                this.audio.src = audioFile;
                this.audio.play().catch(e => {
                    console.log('Ошибка:', e);
                    this.stopPlayback();
                });
            }
            
            startSubtitles() {
                this.subtitles.classList.add('visible');
                this.currentSubtitleIndex = -1;
                
                this.subtitleInterval = setInterval(() => {
                    if (!this.isPlaying || !this.audio) return;
                    
                    const currentTime = this.audio.currentTime;
                    
                    for (let i = 0; i < this.subtitleParts.length; i++) {
                        if (currentTime >= this.subtitleParts[i].start && 
                            currentTime < this.subtitleParts[i].end) {
                            
                            if (i !== this.currentSubtitleIndex) {
                                this.currentSubtitleIndex = i;
                                this.subtitles.textContent = this.subtitleParts[i].text;
                            }
                            break;
                        }
                    }
                }, 100);
            }
            
            startMouthAnimation() {
                let isOpen = false;
                
                this.animationInterval = setInterval(() => {
                    if (!this.isPlaying) return;
                    isOpen = !isOpen;
                    this.image.src = isOpen ? 'mouth-open.png' : 'mouth-closed.png';
                }, 200);
            }
            
            stopMouthAnimation() {
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                this.image.src = 'mouth-closed.png';
            }
            
            stopSubtitles() {
                if (this.subtitleInterval) {
                    clearInterval(this.subtitleInterval);
                    this.subtitleInterval = null;
                }
                this.subtitles.classList.remove('visible');
                this.subtitles.textContent = '';
                this.currentSubtitleIndex = -1;
            }
            
            // ========== 3D АНИМАЦИЯ ==========
            init3D() {
                const container = document.getElementById('canvas-container');
                
                // Сцена
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0xffffff);
                
                // Камера
                this.camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
                this.camera.position.set(0, 0, 5);
                
                // Рендерер
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                this.renderer.setSize(container.clientWidth, container.clientHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                container.appendChild(this.renderer.domElement);
                
                // Свет
                const ambientLight = new THREE.AmbientLight(0xffffff, 1);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(1, 2, 3);
                this.scene.add(directionalLight);
                
                const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
                backLight.position.set(-1, -1, -2);
                this.scene.add(backLight);
                
                // Загрузка модели
                const loader = new GLTFLoader();
                
                loader.load(
                    'anime-head.glb', // Имя твоего файла
                    (gltf) => {
                        this.model = gltf.scene;
                        
                        // Центрируем модель
                        const box = new THREE.Box3().setFromObject(this.model);
                        const center = box.getCenter(new THREE.Vector3());
                        this.model.position.sub(center);
                        
                        // Масштабируем под размер экрана
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const scale = 2.5 / maxDim; // Подгоняем размер
                        this.model.scale.set(scale, scale, scale);
                        
                        this.scene.add(this.model);
                        
                        if (this.loader) {
                            this.loader.style.display = 'none';
                        }
                        
                        console.log('3D модель загружена!');
                    },
                    (xhr) => {
                        // Прогресс загрузки
                        const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                        if (this.loader) {
                            this.loader.textContent = `Загрузка... ${percent}%`;
                        }
                    },
                    (error) => {
                        console.error('Ошибка загрузки модели:', error);
                        if (this.loader) {
                            this.loader.textContent = 'Ошибка загрузки модели';
                        }
                        
                        // Создаем заглушку если модель не загрузилась
                        this.createPlaceholderHead();
                    }
                );
                
                // Запускаем анимацию
                this.animate();
                
                // Обработка ресайза
                window.addEventListener('resize', () => this.onWindowResize());
            }
            
            // Заглушка на случай отсутствия модели
            createPlaceholderHead() {
                const geometry = new THREE.SphereGeometry(1, 32, 32);
                const material = new THREE.MeshStandardMaterial({ color: 0xff99cc });
                const sphere = new THREE.Mesh(geometry, material);
                
                // Глазки
                const eyeGeo = new THREE.SphereGeometry(0.2, 16, 16);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
                
                const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
                eye1.position.set(-0.4, 0.3, 0.8);
                sphere.add(eye1);
                
                const eye2 = new THREE.Mesh(eyeGeo, eyeMat);
                eye2.position.set(0.4, 0.3, 0.8);
                sphere.add(eye2);
                
                // Ротик
                const mouthGeo = new THREE.TorusGeometry(0.3, 0.05, 16, 32, Math.PI);
                const mouthMat = new THREE.MeshStandardMaterial({ color: 0xff6666 });
                const mouth = new THREE.Mesh(mouthGeo, mouthMat);
                mouth.rotation.x = Math.PI / 2;
                mouth.rotation.z = Math.PI;
                mouth.position.set(0, -0.2, 0.8);
                sphere.add(mouth);
                
                this.model = sphere;
                this.scene.add(this.model);
                
                if (this.loader) {
                    this.loader.style.display = 'none';
                }
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                
                if (this.model) {
                    // Вращение вокруг своей оси (как в Майнкрафте)
                    this.model.rotation.y += 0.005;
                    
                    // Плавное движение вверх-вниз
                    const time = this.clock.getElapsedTime();
                    this.model.position.y = Math.sin(time * 1.5) * 0.2;
                    
                    // Легкое покачивание
                    this.model.rotation.z = Math.sin(time * 0.8) * 0.05;
                    this.model.rotation.x = Math.sin(time * 0.5) * 0.05;
                }
                
                this.renderer.render(this.scene, this.camera);
            }
            
            onWindowResize() {
                const container = document.getElementById('canvas-container');
                if (this.camera && this.renderer && container) {
                    this.camera.aspect = container.clientWidth / container.clientHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(container.clientWidth, container.clientHeight);
                }
            }
            
            // ========== ПЕРЕХОД ==========
            playTransition() {
                this.crtEffect.classList.add('active');
                
                setTimeout(() => {
                    this.page1.classList.add('hidden');
                    this.page2.classList.add('visible');
                    
                    // Инициализируем 3D после появления страницы
                    setTimeout(() => {
                        this.init3D();
                    }, 100);
                }, 500);
                
                setTimeout(() => {
                    this.crtEffect.classList.remove('active');
                }, 1000);
            }
            
            onEnded() {
                this.stopMouthAnimation();
                this.stopSubtitles();
                
                if (this.currentState === 'hello') {
                    this.currentState = 'thanks';
                    this.button.textContent = 'thanks';
                } else {
                    if (!this.hasSecondEnded) {
                        this.hasSecondEnded = true;
                        this.playTransition();
                    }
                    this.currentState = 'hello';
                    this.button.textContent = 'hello';
                }
                
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
            
            onError(e) {
                console.error('Ошибка:', e);
                this.stopMouthAnimation();
                this.stopSubtitles();
                this.button.classList.remove('playing');
                this.isPlaying = false;
                alert(`Файл ${this.audioFiles[this.currentState]} не найден!`);
            }
            
            stopPlayback() {
                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                }
                this.stopMouthAnimation();
                this.stopSubtitles();
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', () => {
            new HorrorTo3DAnime();
        });
    </script>
</body>
</html>
