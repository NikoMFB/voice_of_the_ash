<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPEN ME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Courier', monospace;
            touch-action: manipulation;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            position: relative;
            overflow: hidden;
            background: #000;
            margin: 0 auto;
        }

        /* Страница 1 - Хоррор */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: all 0.5s ease;
        }

        #page1 {
            opacity: 1;
            z-index: 2;
        }

        #page1.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Страница 2 - Аниме */
        #page2 {
            background: white;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        #page2.visible {
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }

        /* Эффект выключения монитора */
        .crt-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .crt-effect.active {
            animation: crtShutdown 0.5s forwards;
        }

        @keyframes crtShutdown {
            0% { opacity: 0; }
            10% { opacity: 0.8; transform: scale(0.98); }
            20% { opacity: 1; transform: scale(0.95); }
            30% { opacity: 0.9; transform: scale(0.9) skewX(2deg); }
            40% { opacity: 1; transform: scale(0.85) skewX(-2deg); }
            50% { opacity: 0.7; transform: scale(0.8) skewX(3deg); filter: brightness(2); }
            60% { opacity: 0.9; transform: scale(0.7); filter: brightness(1); }
            70% { opacity: 0.5; transform: scale(0.5) skewX(-5deg); }
            80% { opacity: 0.8; transform: scale(0.3); filter: brightness(0.5); }
            90% { opacity: 0.3; transform: scale(0.1); }
            100% { opacity: 0; transform: scale(0); }
        }

        /* Эффект помех */
        .noise-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.1) 0px,
                rgba(255,255,255,0.2) 2px,
                transparent 2px,
                transparent 4px
            );
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
        }

        .noise-effect.active {
            animation: noise 0.2s infinite;
        }

        @keyframes noise {
            0% { transform: translate(0,0); opacity: 0.8; }
            10% { transform: translate(-2px,2px); opacity: 0.9; }
            20% { transform: translate(2px,-2px); opacity: 0.7; }
            30% { transform: translate(-1px,1px); opacity: 0.8; }
            40% { transform: translate(1px,-1px); opacity: 0.9; }
            50% { transform: translate(-2px,-2px); opacity: 0.7; }
            60% { transform: translate(2px,2px); opacity: 0.8; }
            70% { transform: translate(-1px,-1px); opacity: 0.9; }
            80% { transform: translate(1px,1px); opacity: 0.7; }
            90% { transform: translate(-2px,0); opacity: 0.8; }
            100% { transform: translate(0,0); opacity: 0.7; }
        }

        /* ======= СТРАНИЦА 1 (ХОРРОР) ======= */
        .fullscreen-image {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #characterImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: contrast(1.05) brightness(0.95);
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, 
                        transparent 40%, 
                        rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 3;
        }

        .subtitles-container {
            position: absolute;
            bottom: 180px;
            left: 0;
            width: 100%;
            padding: 0 25px;
            z-index: 20;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .subtitles {
            color: #f0e68c;
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 18px;
            line-height: 1.6;
            font-weight: 500;
            text-align: center;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 1px;
            max-width: 100%;
            width: 100%;
            word-break: keep-all;
            white-space: pre-wrap;
            opacity: 0;
            transition: opacity 0.15s ease;
            text-transform: uppercase;
        }

        .subtitles.visible {
            opacity: 1;
        }

        .bottom-area {
            position: absolute;
            bottom: 70px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        .action-button {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 240, 0.25);
            color: rgba(255, 255, 240, 0.9);
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 22px;
            letter-spacing: 3px;
            padding: 12px 40px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
            text-transform: lowercase;
            min-width: 180px;
            text-align: center;
        }

        .action-button.playing {
            background: rgba(255, 255, 200, 0.2);
            border: 1px solid rgba(255, 255, 200, 0.4);
        }

        /* ======= СТРАНИЦА 2 (АНИМЕ) ======= */
        .anime-page {
            background: white;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Летающая голова */
        .floating-head {
            position: absolute;
            width: 200px;
            height: 200px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            animation: float 8s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15));
        }

        @keyframes float {
            0% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg); }
            25% { transform: translate(-50%, -50%) translate(30px, -20px) rotate(2deg); }
            50% { transform: translate(-50%, -50%) translate(-20px, 30px) rotate(-2deg); }
            75% { transform: translate(-50%, -50%) translate(-30px, -15px) rotate(3deg); }
            100% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg); }
        }

        .floating-head img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Глаза двигаются */
        .eyes {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .eye {
            width: 25px;
            height: 25px;
            background: white;
            border-radius: 50%;
            position: relative;
            animation: lookAround 4s ease-in-out infinite;
        }

        .pupil {
            width: 12px;
            height: 12px;
            background: #8B4513;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: movePupil 3s ease-in-out infinite;
        }

        @keyframes lookAround {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes movePupil {
            0%, 100% { transform: translate(-50%, -50%); }
            25% { transform: translate(-30%, -50%); }
            50% { transform: translate(-50%, -70%); }
            75% { transform: translate(-70%, -50%); }
        }

        /* Милые блестки */
        .sparkle {
            position: absolute;
            color: rgba(255, 200, 255, 0.8);
            font-size: 20px;
            pointer-events: none;
            animation: sparkleFloat 3s ease-in-out infinite;
        }

        @keyframes sparkleFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.8; }
            50% { transform: translate(10px, -10px) rotate(10deg); opacity: 1; }
        }

        /* Кнопка возврата */
        .return-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: #666;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            padding: 10px 25px;
            cursor: pointer;
            z-index: 100;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .return-button:hover {
            background: rgba(0, 0, 0, 0.2);
            color: #333;
        }

        @media (max-width: 390px) {
            .floating-head { width: 160px; height: 160px; }
        }
    </style>
</head>
<body>
    <!-- Эффекты перехода -->
    <div class="crt-effect" id="crtEffect"></div>
    <div class="noise-effect" id="noiseEffect"></div>

    <div class="game-container">
        <!-- СТРАНИЦА 1: ХОРРОР -->
        <div class="page" id="page1">
            <div class="fullscreen-image">
                <img src="mouth-closed.png" alt="" id="characterImage">
            </div>
            <div class="vignette"></div>
            
            <div class="subtitles-container">
                <div class="subtitles" id="subtitles"></div>
            </div>
            
            <div class="bottom-area">
                <button class="action-button" id="actionButton">
                    hello
                </button>
            </div>
        </div>

        <!-- СТРАНИЦА 2: АНИМЕ -->
        <div class="page" id="page2">
            <div class="anime-page">
                <!-- Летающая голова аниме-девочки -->
                <div class="floating-head" id="animeHead">
                    <img src="anime-girl-head.png" alt="Милая аниме девочка" id="animeImage">
                </div>
                
                <!-- Блестки для атмосферы -->
                <div class="sparkle" style="top: 20%; left: 10%;">✨</div>
                <div class="sparkle" style="top: 70%; right: 10%;">✨</div>
                <div class="sparkle" style="top: 30%; right: 15%;">✨</div>
                
                <!-- Кнопка возврата (опционально) -->
                <button class="return-button" id="returnButton" onclick="location.reload()">
                    ↩ вернуться
                </button>
            </div>
        </div>
    </div>

    <script>
        class HorrorToAnimeTransition {
            constructor() {
                // Элементы
                this.image = document.getElementById('characterImage');
                this.button = document.getElementById('actionButton');
                this.subtitles = document.getElementById('subtitles');
                this.page1 = document.getElementById('page1');
                this.page2 = document.getElementById('page2');
                this.crtEffect = document.getElementById('crtEffect');
                this.noiseEffect = document.getElementById('noiseEffect');
                this.animeHead = document.getElementById('animeHead');
                
                // Аудио файлы
                this.audioFiles = {
                    hello: 'voice1.mp3',
                    thanks: 'voice2.mp3'
                };
                
                // Субтитры
                this.subtitleParts = [
                    { text: "Соединение прервано.", start: 0, end: 2.5 },
                    { text: "Мне жаль, что я прерываю вас, Мелина,", start: 2.5, end: 5.5 },
                    { text: "если вы еще помните это имя,", start: 5.5, end: 8 },
                    { text: "но боюсь, вас дезинформировали.", start: 8, end: 10.5 },
                    { text: "Вы здесь не для того,", start: 10.5, end: 12.5 },
                    { text: "чтобы получить подарок,", start: 12.5, end: 14.5 },
                    { text: "и вас не позвал сюда человек,", start: 14.5, end: 17 },
                    { text: "которого вы предполагаете,", start: 17, end: 19 },
                    { text: "хотя вас действительно позвали.", start: 19, end: 21.5 },
                    { text: "Вы все были вызваны сюда,", start: 21.5, end: 24 },
                    { text: "в лабиринт звуков и запахов,", start: 24, end: 26.5 },
                    { text: "дезинформации и несчастий.", start: 26.5, end: 29 },
                    { text: "Лабиринт без выхода,", start: 29, end: 31 },
                    { text: "лабиринт без приза.", start: 31, end: 33 },
                    { text: "Вы даже не понимаете,", start: 33, end: 35 },
                    { text: "что попали в ловушку.", start: 35, end: 37 },
                    { text: "Ваша жажда крови", start: 37, end: 39 },
                    { text: "загнала вас в бесконечные круги,", start: 39, end: 42 },
                    { text: "преследуя крики детей", start: 42, end: 44 },
                    { text: "в какой-то невидимой комнате,", start: 44, end: 46.5 },
                    { text: "всегда кажущейся такой близкой,", start: 46.5, end: 49 },
                    { text: "но почему-то недостижимой,", start: 49, end: 51.5 },
                    { text: "но вы никогда их не найдете.", start: 51.5, end: 54.5 },
                    { text: "Никто из вас не найдет.", start: 54.5, end: 57 },
                    { text: "Здесь ваша история заканчивается.", start: 57, end: 60 }
                ];
                
                this.currentState = 'hello';
                this.isPlaying = false;
                this.audio = new Audio();
                this.animationInterval = null;
                this.subtitleInterval = null;
                this.currentSubtitleIndex = -1;
                this.hasSecondEnded = false; // Флаг для отслеживания окончания второй записи
                
                this.init();
            }
            
            init() {
                this.button.addEventListener('click', () => this.onButtonClick());
                
                this.audio.addEventListener('ended', () => this.onEnded());
                this.audio.addEventListener('error', (e) => this.onError(e));
                
                document.addEventListener('touchstart', () => {}, { once: true });
            }
            
            onButtonClick() {
                if (this.isPlaying) return;
                this.startPlayback();
            }
            
            startPlayback() {
                this.isPlaying = true;
                this.button.classList.add('playing');
                
                this.startMouthAnimation();
                
                if (this.currentState === 'thanks') {
                    this.startSubtitles();
                }
                
                const audioFile = this.audioFiles[this.currentState];
                this.audio.src = audioFile;
                this.audio.play().catch(e => {
                    console.log('Ошибка:', e);
                    this.stopPlayback();
                });
            }
            
            startSubtitles() {
                this.subtitles.classList.add('visible');
                this.currentSubtitleIndex = -1;
                
                this.subtitleInterval = setInterval(() => {
                    if (!this.isPlaying || !this.audio) return;
                    
                    const currentTime = this.audio.currentTime;
                    
                    for (let i = 0; i < this.subtitleParts.length; i++) {
                        if (currentTime >= this.subtitleParts[i].start && 
                            currentTime < this.subtitleParts[i].end) {
                            
                            if (i !== this.currentSubtitleIndex) {
                                this.currentSubtitleIndex = i;
                                this.subtitles.textContent = this.subtitleParts[i].text;
                            }
                            break;
                        }
                    }
                }, 100);
            }
            
            startMouthAnimation() {
                let isOpen = false;
                
                this.animationInterval = setInterval(() => {
                    if (!this.isPlaying) return;
                    isOpen = !isOpen;
                    this.image.src = isOpen ? 'mouth-open.png' : 'mouth-closed.png';
                }, 200);
            }
            
            stopMouthAnimation() {
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                this.image.src = 'mouth-closed.png';
            }
            
            stopSubtitles() {
                if (this.subtitleInterval) {
                    clearInterval(this.subtitleInterval);
                    this.subtitleInterval = null;
                }
                this.subtitles.classList.remove('visible');
                this.subtitles.textContent = '';
                this.currentSubtitleIndex = -1;
            }
            
            // Эффект выключения монитора
            playTransition() {
                // Активируем эффекты
                this.crtEffect.classList.add('active');
                this.noiseEffect.classList.add('active');
                
                // Через 0.5 секунды переключаем страницы
                setTimeout(() => {
                    this.page1.classList.add('hidden');
                    this.page2.classList.add('visible');
                }, 500);
                
                // Убираем эффекты через 1 секунду
                setTimeout(() => {
                    this.crtEffect.classList.remove('active');
                    this.noiseEffect.classList.remove('active');
                }, 1000);
            }
            
            onEnded() {
                this.stopMouthAnimation();
                this.stopSubtitles();
                
                if (this.currentState === 'hello') {
                    this.currentState = 'thanks';
                    this.button.textContent = 'thanks';
                } else {
                    // Вторая запись закончилась - запускаем переход
                    if (!this.hasSecondEnded) {
                        this.hasSecondEnded = true;
                        this.playTransition();
                    }
                    this.currentState = 'hello';
                    this.button.textContent = 'hello';
                }
                
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
            
            onError(e) {
                console.error('Ошибка:', e);
                this.stopMouthAnimation();
                this.stopSubtitles();
                this.button.classList.remove('playing');
                this.isPlaying = false;
                alert(`Файл ${this.audioFiles[this.currentState]} не найден!`);
            }
            
            stopPlayback() {
                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                }
                this.stopMouthAnimation();
                this.stopSubtitles();
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new HorrorToAnimeTransition();
        });
    </script>
</body>
</html>
