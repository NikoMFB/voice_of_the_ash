<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OPEN ME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            min-height: 100vh;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Courier', monospace;
            touch-action: manipulation;
            padding: 0;
            margin: 0;
        }

        /* Еле заметный шум */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.02) 0px,
                rgba(255, 255, 255, 0.02) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
        }

        .game-container {
            width: 100%;
            max-width: 390px;
            height: 100vh;
            max-height: 844px;
            position: relative;
            overflow: hidden;
            background: #000;
            margin: 0 auto;
        }

        /* Основное изображение на весь экран */
        .fullscreen-image {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #characterImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: contrast(1.05) brightness(0.95);
            image-rendering: crisp-edges;
        }

        /* Виньетка для глубины */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, 
                        transparent 40%, 
                        rgba(0, 0, 0, 0.5) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* Контейнер для субтитров */
        .subtitles-container {
            position: absolute;
            bottom: 180px;
            left: 0;
            width: 100%;
            padding: 0 25px;
            z-index: 20;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        /* Чистый текст субтитров в стиле Outlast */
        .subtitles {
            color: #f0e68c; /* Приглушенный желтый, как в хоррор играх */
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 18px;
            line-height: 1.6;
            font-weight: 500;
            text-align: center;
            text-shadow: 
                2px 2px 0px #000,
                0 0 10px rgba(240, 230, 140, 0.3);
            letter-spacing: 1px;
            max-width: 100%;
            width: 100%;
            word-break: keep-all;
            white-space: pre-wrap;
            opacity: 0;
            transition: opacity 0.15s ease;
            text-transform: uppercase; /* Дает тот самый outlast стиль */
            font-size: 17px; /* Чуть меньше для uppercase */
        }

        .subtitles.visible {
            opacity: 1;
        }

        /* Анимация появления */
        .subtitles.fade-in {
            animation: subtitleFade 0.2s ease;
        }

        @keyframes subtitleFade {
            0% { opacity: 0; transform: translateY(5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Нижняя область для кнопки */
        .bottom-area {
            position: absolute;
            bottom: 70px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        /* Кнопка в стиле Outlast */
        .action-button {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 240, 0.25);
            color: rgba(255, 255, 240, 0.9);
            font-family: 'Courier New', 'Courier', monospace;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 3px;
            padding: 12px 40px;
            cursor: pointer;
            pointer-events: auto;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            transition: all 0.2s ease;
            text-transform: lowercase;
            box-shadow: 0 0 15px rgba(255, 255, 200, 0.1);
            min-width: 180px;
            text-align: center;
            border-radius: 0;
            text-shadow: 1px 1px 0px #000;
        }

        .action-button:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.98);
        }

        .action-button.playing {
            background: rgba(255, 255, 200, 0.2);
            border: 1px solid rgba(255, 255, 200, 0.4);
            box-shadow: 0 0 25px rgba(255, 255, 200, 0.2);
        }

        @media (max-width: 390px) {
            .subtitles {
                font-size: 16px;
                line-height: 1.5;
                letter-spacing: 0.5px;
            }
            
            .action-button {
                font-size: 20px;
                padding: 10px 30px;
                min-width: 160px;
            }
            
            .bottom-area {
                bottom: 60px;
            }
            
            .subtitles-container {
                bottom: 160px;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Основное изображение -->
        <div class="fullscreen-image">
            <img src="mouth-closed.png" alt="" id="characterImage">
        </div>
        
        <!-- Виньетка -->
        <div class="vignette"></div>
        
        <!-- Чистые субтитры (без рамки) -->
        <div class="subtitles-container">
            <div class="subtitles" id="subtitles"></div>
        </div>
        
        <!-- Кнопка -->
        <div class="bottom-area">
            <button class="action-button" id="actionButton">
                hello
            </button>
        </div>
    </div>

    <script>
        class OutlastSubtitles {
            constructor() {
                // Элементы
                this.image = document.getElementById('characterImage');
                this.button = document.getElementById('actionButton');
                this.subtitles = document.getElementById('subtitles');
                
                // Аудио файлы
                this.audioFiles = {
                    hello: 'voice1.mp3',
                    thanks: 'voice2.mp3'
                };
                
                // Разбивка текста для субтитров (оптимизировано)
                this.subtitleParts = [
                    { text: "Соединение прервано.", start: 0, end: 2.5 },
                    { text: "Мне жаль, что я прерываю вас, Элизабет,", start: 2.5, end: 5.5 },
                    { text: "если вы еще помните это имя,", start: 5.5, end: 8 },
                    { text: "но боюсь, вас дезинформировали.", start: 8, end: 10.5 },
                    { text: "Вы здесь не для того,", start: 10.5, end: 12.5 },
                    { text: "чтобы получить подарок,", start: 12.5, end: 14.5 },
                    { text: "и вас не позвал сюда человек,", start: 14.5, end: 17 },
                    { text: "которого вы предполагаете,", start: 17, end: 19 },
                    { text: "хотя вас действительно позвали.", start: 19, end: 21.5 },
                    { text: "Вы все были вызваны сюда,", start: 21.5, end: 24 },
                    { text: "в лабиринт звуков и запахов,", start: 24, end: 26.5 },
                    { text: "дезинформации и несчастий.", start: 26.5, end: 29 },
                    { text: "Лабиринт без выхода,", start: 29, end: 31 },
                    { text: "лабиринт без приза.", start: 31, end: 33 },
                    { text: "Вы даже не понимаете,", start: 33, end: 35 },
                    { text: "что попали в ловушку.", start: 35, end: 37 },
                    { text: "Ваша жажда крови", start: 37, end: 39 },
                    { text: "загнала вас в бесконечные круги,", start: 39, end: 42 },
                    { text: "преследуя крики детей", start: 42, end: 44 },
                    { text: "в какой-то невидимой комнате,", start: 44, end: 46.5 },
                    { text: "всегда кажущейся такой близкой,", start: 46.5, end: 49 },
                    { text: "но почему-то недостижимой,", start: 49, end: 51.5 },
                    { text: "но вы никогда их не найдете.", start: 51.5, end: 54.5 },
                    { text: "Никто из вас не найдет.", start: 54.5, end: 57 },
                    { text: "Здесь ваша история заканчивается.", start: 57, end: 60 }
                ];
                
                this.currentState = 'hello';
                this.isPlaying = false;
                this.audio = new Audio();
                this.animationInterval = null;
                this.subtitleInterval = null;
                this.currentSubtitleIndex = -1;
                
                this.init();
            }
            
            init() {
                this.button.addEventListener('click', () => this.onButtonClick());
                
                this.audio.addEventListener('ended', () => this.onEnded());
                this.audio.addEventListener('error', (e) => this.onError(e));
                
                document.addEventListener('touchstart', () => {}, { once: true });
            }
            
            onButtonClick() {
                if (this.isPlaying) return;
                this.startPlayback();
            }
            
            startPlayback() {
                this.isPlaying = true;
                this.button.classList.add('playing');
                
                // Запускаем анимацию рта
                this.startMouthAnimation();
                
                // Если это вторая запись - запускаем субтитры
                if (this.currentState === 'thanks') {
                    this.startSubtitles();
                }
                
                // Запускаем аудио
                const audioFile = this.audioFiles[this.currentState];
                this.audio.src = audioFile;
                this.audio.play().catch(e => {
                    console.log('Ошибка:', e);
                    this.stopPlayback();
                });
            }
            
            startSubtitles() {
                this.subtitles.classList.add('visible');
                this.currentSubtitleIndex = -1;
                
                // Обновляем субтитры каждые 100мс
                this.subtitleInterval = setInterval(() => {
                    if (!this.isPlaying || !this.audio) return;
                    
                    const currentTime = this.audio.currentTime;
                    
                    // Ищем текущий субтитр
                    for (let i = 0; i < this.subtitleParts.length; i++) {
                        if (currentTime >= this.subtitleParts[i].start && 
                            currentTime < this.subtitleParts[i].end) {
                            
                            // Если нашли новый субтитр
                            if (i !== this.currentSubtitleIndex) {
                                this.currentSubtitleIndex = i;
                                this.subtitles.textContent = this.subtitleParts[i].text;
                                this.subtitles.classList.add('fade-in');
                                
                                setTimeout(() => {
                                    this.subtitles.classList.remove('fade-in');
                                }, 200);
                            }
                            break;
                        }
                    }
                    
                }, 100);
            }
            
            startMouthAnimation() {
                let isOpen = false;
                
                this.animationInterval = setInterval(() => {
                    if (!this.isPlaying) return;
                    
                    isOpen = !isOpen;
                    this.image.src = isOpen ? 'mouth-open.png' : 'mouth-closed.png';
                    
                }, 200);
            }
            
            stopMouthAnimation() {
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                this.image.src = 'mouth-closed.png';
            }
            
            stopSubtitles() {
                if (this.subtitleInterval) {
                    clearInterval(this.subtitleInterval);
                    this.subtitleInterval = null;
                }
                this.subtitles.classList.remove('visible');
                this.subtitles.textContent = '';
                this.currentSubtitleIndex = -1;
            }
            
            onEnded() {
                this.stopMouthAnimation();
                this.stopSubtitles();
                
                // Меняем состояние
                if (this.currentState === 'hello') {
                    this.currentState = 'thanks';
                    this.button.textContent = 'thanks';
                } else {
                    this.currentState = 'hello';
                    this.button.textContent = 'hello';
                }
                
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
            
            onError(e) {
                console.error('Ошибка:', e);
                this.stopMouthAnimation();
                this.stopSubtitles();
                this.button.classList.remove('playing');
                this.isPlaying = false;
                alert(`Файл ${this.audioFiles[this.currentState]} не найден!`);
            }
            
            stopPlayback() {
                if (this.audio) {
                    this.audio.pause();
                    this.audio.currentTime = 0;
                }
                this.stopMouthAnimation();
                this.stopSubtitles();
                this.button.classList.remove('playing');
                this.isPlaying = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new OutlastSubtitles();
        });
    </script>
</body>
</html>
